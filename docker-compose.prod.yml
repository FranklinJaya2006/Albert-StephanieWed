name: birdies-gift

services:
  edge:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX in .env}-edge:${EDGE_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    restart: unless-stopped
    # No published ports: traffic arrives through the Cloudflare Tunnel (service cloudflared below),
    # which reaches this container at http://edge:80. HTTPS is terminated by Cloudflare.
    environment:
      DOMAIN_WEB: ${DOMAIN_WEB:?set DOMAIN_WEB in .env}
      DOMAIN_BOOTH: ${DOMAIN_BOOTH:?set DOMAIN_BOOTH in .env}
      DOMAIN_N8N: ${DOMAIN_N8N:?set DOMAIN_N8N in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
      back:
        condition: service_healthy
    networks:
      - default
      - automation

  web:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX in .env}-web:${WEB_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    restart: unless-stopped

  admin:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX in .env}-admin:${ADMIN_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    restart: unless-stopped

  back:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX in .env}-back:${BACK_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    restart: unless-stopped
    environment:
      WEDDING_ADMIN_USERNAME: ${WEDDING_ADMIN_USERNAME:?set WEDDING_ADMIN_USERNAME in .env}
      WEDDING_ADMIN_PASSWORD: ${WEDDING_ADMIN_PASSWORD:?set WEDDING_ADMIN_PASSWORD in .env}
    volumes:
      - booth_data:/data

  # Cloudflare Tunnel: carries the three public hostnames to the edge proxy. In the Cloudflare
  # dashboard (Zero Trust > Networks > Tunnels) add three Public Hostnames, each pointing to
  # HTTP  edge:80 : DOMAIN_WEB, DOMAIN_BOOTH and DOMAIN_N8N.
  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-latest}
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - edge

volumes:
  caddy_data:
  caddy_config:
  booth_data:
  waha_data:

networks:
  automation:
    external: true
    name: automation