name: birdies-gift

services:
  edge:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX in .env}-edge:${EDGE_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN_WEB: ${DOMAIN_WEB:?set DOMAIN_WEB in .env}
      DOMAIN_BOOTH: ${DOMAIN_BOOTH:?set DOMAIN_BOOTH in .env}
      DOMAIN_N8N: ${DOMAIN_N8N:?set DOMAIN_N8N in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
      back:
        condition: service_healthy
    networks:
      - default
      - automation

  web:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX in .env}-web:${WEB_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    restart: unless-stopped

  admin:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX in .env}-admin:${ADMIN_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    restart: unless-stopped

  back:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX in .env}-back:${BACK_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    restart: unless-stopped
    environment:
      WEDDING_ADMIN_USERNAME: ${WEDDING_ADMIN_USERNAME:?set WEDDING_ADMIN_USERNAME in .env}
      WEDDING_ADMIN_PASSWORD: ${WEDDING_ADMIN_PASSWORD:?set WEDDING_ADMIN_PASSWORD in .env}
    volumes:
      - booth_data:/data

  waha:
    image: devlikeapro/waha:${WAHA_VERSION:-latest}
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:?set WAHA_API_KEY in .env}
      WHATSAPP_API_KEY: ${WAHA_API_KEY}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - waha_data:/app/.sessions

volumes:
  caddy_data:
  caddy_config:
  booth_data:
  waha_data:

networks:
  automation:
    external: true
    name: automation