# Pull requests: lint + build, and build the Docker images (not pushed).
# Pushes to main: the same, then push the images to GHCR and deploy to the VPS.
#
# Deploy is skipped until the repository variable DEPLOY_ENABLED is set to "true".
# Required repository secrets for deploy: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS
# (optional: VPS_PORT, default 22). See README.md → Deploy.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint -w web
      - run: npm run lint -w booth
      - run: npm run build -w web
      - run: npm run build -w booth
      - run: npm run build -w back

  images:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [back, edge]
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR image names must be lowercase.
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.image }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
          # Links the package to this repo so the deploy job's GITHUB_TOKEN may pull it.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: images
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Never run two deploys at once, and never cancel one halfway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_PATH: /opt/birdies-gift
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy compose file
        run: |
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" docker-compose.prod.yml \
            "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/docker-compose.prod.yml"
      - name: Pull and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $VPS_PORT $VPS_USER@$VPS_HOST"
          # The job token is short-lived, so log in again on every deploy.
          printf '%s' "$GHCR_TOKEN" | $SSH "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          $SSH "cd '$DEPLOY_PATH' \
            && IMAGE_TAG='$IMAGE_TAG' docker compose -f docker-compose.prod.yml pull \
            && IMAGE_TAG='$IMAGE_TAG' docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 120 --remove-orphans \
            && docker image prune -f"
