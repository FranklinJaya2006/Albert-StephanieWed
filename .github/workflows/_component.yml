name: Component pipeline

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string

permissions:
  contents: read

jobs:
  check-and-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: inputs.component != 'edge'
        with:
          node-version: 24
          cache: npm
      - name: Check invitation
        if: inputs.component == 'web'
        run: |
          npm ci -w web -w back
          npm run build -w back
          npm test -w back
          npm run lint -w web
          npm run build -w web
      - name: Check admin
        if: inputs.component == 'admin'
        run: |
          npm ci -w web -w booth -w back
          npm run build -w back
          npm test -w back
          npm run lint -w booth
          npm exec -w web -- eslint src/pages/Admin.tsx src/lib/weddingApi.ts
          npm run build -w booth
      - name: Validate production compose
        if: inputs.component == 'edge'
        env:
          IMAGE_PREFIX: ghcr.io/example/wedding
          DOMAIN_WEB: invitation.example.test
          DOMAIN_BOOTH: admin.example.test
          DOMAIN_N8N: automation.example.test
          ACME_EMAIL: ci@example.test
          WEDDING_ADMIN_USERNAME: ci-user
          WEDDING_ADMIN_PASSWORD: ci-only-placeholder
          N8N_ENCRYPTION_KEY: ci-only-placeholder
          WAHA_API_KEY: ci-only-placeholder
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Check deployment updater
        if: inputs.component == 'edge'
        run: bash deploy/test-update-service.sh
      - name: Validate n8n workflow exports
        if: inputs.component == 'edge'
        run: |
          find n8n/workflows -type f -name '*.json' -exec python3 -m json.tool {} > /dev/null \;
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: repository
        name: Lowercase repository
        run: echo "lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: image
        name: Image name
        env:
          COMPONENT: ${{ inputs.component }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-$COMPONENT" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ inputs.component }}
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ inputs.component }}
          cache-to: type=gha,mode=max,scope=${{ inputs.component }}
      - name: Build shared API image
        if: inputs.component == 'web' || inputs.component == 'admin'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.back
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ steps.repository.outputs.lower }}-back:${{ github.sha }}
            ghcr.io/${{ steps.repository.outputs.lower }}-back:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=back
          cache-to: type=gha,mode=max,scope=back

  deploy:
    needs: check-and-image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
      queue: max
    env:
      DEPLOY_PATH: /opt/birdies-gift
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      COMPONENT: ${{ inputs.component }}
      IMAGE_TAG: ${{ github.sha }}
      DEPLOY_RUN: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy deployment configuration
        run: |
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" deploy/update-service.sh \
            "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/"
          if [ "$COMPONENT" = edge ]; then
            scp -i ~/.ssh/deploy_key -P "$VPS_PORT" docker-compose.prod.yml \
              "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/docker-compose.prod.yml"
          fi
      - name: Authenticate registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
      - name: Update this component only
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd '$DEPLOY_PATH' && bash update-service.sh '$COMPONENT' '$IMAGE_TAG' '$DEPLOY_RUN'"
