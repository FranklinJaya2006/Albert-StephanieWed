# LOCAL development only: n8n + WAHA. The apps run with `npm run dev --workspace=<name>`.
# The production stack for the VPS is docker-compose.prod.yml.
services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      GENERIC_TIMEZONE: Asia/Jakarta
      TZ: Asia/Jakarta
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:-change_me}
      WHATSAPP_API_KEY: ${WAHA_API_KEY:-change_me}
    ports:
      - "3000:3000"
    volumes:
      - waha_data:/app/.sessions

volumes:
  n8n_data:
  waha_data:
